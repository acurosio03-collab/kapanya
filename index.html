<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14062e">
<title>Naura's Little Universe 💗</title>
<style>
:root{--pink:#ff5fb0;--pink2:#ff9ed2;--purple:#8b5cf6;--night:#0d0524;--glass:rgba(255,255,255,.09);--line:rgba(255,160,215,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--night);color:#fff;font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:0;color:inherit}
.bg{position:fixed;inset:0;background:
 radial-gradient(ellipse at 20% 15%,rgba(139,92,246,.55),transparent 55%),
 radial-gradient(ellipse at 85% 30%,rgba(255,95,176,.4),transparent 55%),
 radial-gradient(ellipse at 50% 100%,rgba(40,70,180,.55),transparent 60%),
 linear-gradient(180deg,#14062e,#0d0524 60%,#080319);background-size:140% 140%;animation:neb 22s ease-in-out infinite alternate}
@keyframes neb{to{background-position:100% 100%}}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:30}
.fh{position:absolute;bottom:-30px;animation:rise linear forwards;opacity:.0;will-change:transform}
@keyframes rise{10%{opacity:.9}100%{transform:translateY(-110vh) translateX(var(--dx));opacity:0}}
.sp{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 8px 2px var(--pink2);animation:spark .9s ease-out forwards}
@keyframes spark{to{transform:translate(var(--x),var(--y)) scale(0);opacity:0}}
/* ===== INTRO ===== */
#intro{position:fixed;inset:0;z-index:5}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.nogl #gl{display:none}
#cssheart{display:none;position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font-size:min(60vw,320px);line-height:1;filter:drop-shadow(0 0 40px #ff3d9a);animation:cspin 6s ease-in-out infinite}
.nogl #cssheart{display:block}
@keyframes cspin{50%{transform:translate(-50%,-56%) rotateY(30deg)}}
.stage-txt{position:absolute;left:0;right:0;bottom:calc(14% + env(safe-area-inset-bottom));text-align:center;padding:0 22px;pointer-events:none}
.stage-txt>div{opacity:0}
.stage-txt .show{animation:pop .9s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes pop{0%{opacity:0;transform:translateY(18px) scale(.85)}70%{opacity:1;transform:translateY(-4px) scale(1.04)}100%{opacity:1;transform:none}}
#t1{font-weight:900;letter-spacing:.06em;font-size:clamp(18px,5.4vw,34px);text-shadow:0 0 18px #ff5fb0,0 0 40px #8b5cf6;text-transform:uppercase}
#t2{margin-top:10px;font-weight:800;font-size:clamp(13px,3.8vw,20px);color:#ffd6ec;letter-spacing:.12em;text-shadow:0 0 12px #ff5fb0}
#t3{margin-top:8px;font-size:clamp(12px,3.3vw,16px);color:#e8d9ff;opacity:.9}
#start{position:absolute;left:50%;bottom:calc(4.5% + env(safe-area-inset-bottom));transform:translateX(-50%) scale(.6);opacity:0;pointer-events:none;
 padding:16px 28px;border-radius:999px;font-weight:900;font-size:clamp(14px,4vw,18px);letter-spacing:.04em;white-space:nowrap;
 background:linear-gradient(180deg,#ff8fcb,#ff3d9a 55%,#d81b7a);box-shadow:0 6px 0 #8f0f52,0 10px 30px rgba(255,61,154,.6),inset 0 2px 0 rgba(255,255,255,.55);transition:.5s cubic-bezier(.2,1.6,.4,1)}
#start.on{opacity:1;transform:translateX(-50%) scale(1);pointer-events:auto;animation:bob 2s ease-in-out infinite .6s}
@keyframes bob{50%{transform:translateX(-50%) translateY(-5px) scale(1.03)}}
#start:active{transform:translateX(-50%) translateY(5px) scale(.98);box-shadow:0 1px 0 #8f0f52,0 4px 14px rgba(255,61,154,.6)}
.top-btns{position:fixed;top:calc(12px + env(safe-area-inset-top));right:12px;display:flex;gap:8px;z-index:40}
.chip{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:9px 14px;border-radius:999px;font-size:13px;font-weight:700}
#skip{position:fixed;top:calc(12px + env(safe-area-inset-top));left:12px;z-index:40}
#peek{position:absolute;left:50%;top:44%;width:84px;height:84px;margin:-100px 0 0 40px;pointer-events:none;transform:translateX(60px) scale(.2) rotate(30deg);opacity:0;transition:1s cubic-bezier(.2,1.5,.4,1)}
#peek.on{transform:translateX(min(34vw,120px)) scale(1) rotate(14deg);opacity:1}
#peek svg{width:100%;height:100%;animation:wig 2.4s ease-in-out infinite;filter:drop-shadow(0 0 12px #ff5fb0)}
@keyframes wig{50%{transform:rotate(-8deg) translateY(-4px)}}
.eye{transform-origin:center;transform-box:fill-box;animation:blink 4s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
#flash{position:fixed;inset:0;z-index:50;pointer-events:none;opacity:0;background:radial-gradient(circle,#fff 0,#ffb3e0 30%,#a55bff 70%,#2a0a5e);transition:opacity .6s}
#flash.on{opacity:1}
#portal{position:fixed;inset:0;z-index:45;pointer-events:none;opacity:0;display:grid;place-items:center;overflow:hidden}
#portal i{position:absolute;width:140vmax;height:140vmax;border-radius:50%;background:conic-gradient(from 0deg,#ff3d9a,#8b5cf6,#27c5ff,#ff9ed2,#ff3d9a);
 -webkit-mask:radial-gradient(circle,transparent 0 8%,#000 9% 100%);mask:radial-gradient(circle,transparent 0 8%,#000 9% 100%);transform:scale(.05);animation:port 1.3s ease-in forwards,rot 1.3s linear infinite}
#portal b{position:absolute;width:60vmin;height:60vmin;border-radius:50%;border:3px solid #fff;box-shadow:0 0 40px #fff,inset 0 0 40px #ff9ed2;transform:scale(.1);animation:ring 1.3s ease-in forwards}
#portal.on{opacity:1}
@keyframes port{to{transform:scale(1)}}@keyframes rot{to{rotate:360deg}}@keyframes ring{to{transform:scale(4);opacity:0}}
/* ===== GAME ===== */
#game{position:fixed;inset:0;z-index:10;display:none;overflow-y:auto;-webkit-overflow-scrolling:touch}
#game.on{display:block}
.wrap{max-width:520px;margin:0 auto;padding:calc(64px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom))}
.hud{position:fixed;left:0;right:0;top:0;z-index:35;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:none;gap:10px;align-items:center;background:linear-gradient(180deg,rgba(13,5,36,.9),transparent)}
.hud.on{display:flex}
.hud .lv{font-weight:900;font-size:12px;letter-spacing:.1em;color:var(--pink2);white-space:nowrap}
.bar{flex:1;height:9px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff5fb0,#8b5cf6);border-radius:9px;transition:width .6s}
.hud .xp{font-weight:800;font-size:12px;white-space:nowrap}
.hud #sndG{margin-left:4px;padding:6px 10px}
.screen{background:var(--glass);border:1px solid var(--line);border-radius:26px;padding:22px 18px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 12px 40px rgba(0,0,0,.35)}
.t1{animation:inUp .7s cubic-bezier(.2,1.2,.4,1)}.t2{animation:inZoom .7s cubic-bezier(.2,1.3,.4,1)}.t3{animation:inFlip .8s ease}.t4{animation:inSwing .8s cubic-bezier(.2,1.3,.4,1)}.t5{animation:inBurst .9s cubic-bezier(.2,1.4,.4,1)}
@keyframes inUp{from{opacity:0;transform:translateY(60px)}}
@keyframes inZoom{from{opacity:0;transform:scale(.4)}}
@keyframes inFlip{from{opacity:0;transform:perspective(700px) rotateY(-80deg)}}
@keyframes inSwing{from{opacity:0;transform:translateX(90px) rotate(8deg)}}
@keyframes inBurst{from{opacity:0;transform:scale(1.7);filter:blur(12px)}}
.badge{display:inline-block;font-size:11px;font-weight:900;letter-spacing:.14em;color:#ffd6ec;background:rgba(255,95,176,.2);border:1px solid var(--line);padding:5px 11px;border-radius:99px;margin-bottom:12px}
h2{margin:0 0 6px;font-size:clamp(20px,5.6vw,26px);line-height:1.25}
.q{font-size:clamp(17px,4.8vw,21px);font-weight:700;line-height:1.4;margin:6px 0 16px}
.sub{opacity:.85;font-size:14px;line-height:1.55;margin:0 0 14px}
.opt{display:block;width:100%;text-align:left;margin:9px 0;padding:14px 16px;border-radius:16px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);font-size:15px;font-weight:600;transition:.2s}
.opt:active{transform:scale(.98)}.opt:hover{background:rgba(255,95,176,.25)}
.opt.ok{background:rgba(70,220,150,.3);border-color:#5df0b0}.opt.no{background:rgba(255,80,110,.28);border-color:#ff7b95}
.opt:disabled{cursor:default}
.fb{margin-top:12px;padding:12px 14px;border-radius:14px;background:rgba(0,0,0,.28);font-size:14px;line-height:1.5;animation:inUp .4s}
.btn{display:inline-block;margin-top:14px;padding:14px 24px;border-radius:999px;font-weight:900;font-size:15px;background:linear-gradient(180deg,#ff8fcb,#ff3d9a 60%,#d81b7a);box-shadow:0 5px 0 #8f0f52,0 8px 22px rgba(255,61,154,.45);transition:.15s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #8f0f52}
.btn.alt{background:linear-gradient(180deg,#9b7bff,#6a3fe0);box-shadow:0 5px 0 #3b1f93,0 8px 22px rgba(139,92,246,.45)}
.btn.wa{background:linear-gradient(180deg,#3fe27f,#16b055);box-shadow:0 5px 0 #0b6d33,0 8px 22px rgba(30,200,100,.4)}
.btn.ghost{background:rgba(255,255,255,.12);box-shadow:none;border:1px solid var(--line)}
.row{display:flex;flex-wrap:wrap;gap:10px}
.scan{position:relative;width:200px;height:200px;margin:14px auto;border-radius:50%;display:grid;place-items:center;font-size:48px;font-weight:900;background:radial-gradient(circle,rgba(255,95,176,.35),transparent 70%);border:2px solid var(--line)}
.scan::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:3px solid transparent;border-top-color:#ff9ed2;animation:rot2 1s linear infinite}
.scan.done::after{animation:none;border-color:#5df0b0}
@keyframes rot2{to{transform:rotate(360deg)}}
.meter{margin:10px 0}.meter span{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:4px}
.boss{display:flex;align-items:center;gap:12px;margin-bottom:12px}.boss .face{font-size:44px;animation:wig 2s infinite}
.hp{flex:1;height:14px;background:rgba(255,255,255,.14);border-radius:9px;overflow:hidden}.hp i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff3d6e,#ff9ed2);transition:width .7s}
label.f{display:block;margin:14px 0 6px;font-size:13px;font-weight:800;color:#ffd6ec;letter-spacing:.04em}
input,textarea{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.28);color:#fff;font:inherit;font-size:15px;color-scheme:dark}
input::placeholder{color:rgba(255,255,255,.5)}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips button{padding:10px 14px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);font-size:14px;font-weight:600}
.chips button.sel{background:linear-gradient(180deg,#ff8fcb,#ff3d9a);border-color:#fff}
.report{background:linear-gradient(160deg,rgba(255,95,176,.28),rgba(139,92,246,.28));border:2px dashed var(--pink2);border-radius:20px;padding:18px;margin-top:12px}
.report h3{margin:0 0 10px;text-align:center;letter-spacing:.08em;font-size:17px}
.report dl{margin:0}.report dt{font-size:11px;font-weight:900;letter-spacing:.1em;color:var(--pink2);margin-top:10px}.report dd{margin:2px 0 0;font-size:15px;font-weight:600;word-break:break-word}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,30px);background:#fff;color:#4a0d33;padding:11px 18px;border-radius:99px;font-weight:800;font-size:14px;opacity:0;transition:.35s;z-index:80;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;transition-duration:.01s!important}.bg{animation:none}}
</style>
</head>
<body>
<div class="bg"></div>
<div id="fx"></div>

<!-- INTRO -->

      <path d="M50 90C12 62 6 40 12 27 20 10 42 12 50 30 58 12 80 10 88 27 94 40 88 62 50 90Z" fill="url(#hg)" stroke="#fff" stroke-width="3"/>
      <g class="eye"><ellipse cx="36" cy="46" rx="6" ry="8" fill="#3a0a2a"/><circle cx="38" cy="43" r="2.4" fill="#fff"/></g>
      <g class="eye"><ellipse cx="64" cy="46" rx="6" ry="8" fill="#3a0a2a"/><circle cx="66" cy="43" r="2.4" fill="#fff"/></g>
      <path d="M41 60Q50 70 59 60" stroke="#3a0a2a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <ellipse cx="26" cy="58" rx="6" ry="3.5" fill="#ff5f8f" opacity=".6"/><ellipse cx="74" cy="58" rx="6" ry="3.5" fill="#ff5f8f" opacity=".6"/>
    </svg>
  </div>
  <div class="stage-txt">
    <div id="t1">Welcome to Naura's Little Universe 💗</div>
    <div id="t2">✨ SPECIAL LEVEL UNLOCKED: NAURA ✨</div>
    <div id="t3">Dibuat oleh GERDY dengan sedikit keberanian dan banyak ide absurd. WKWK 😭</div>
  </div>
  <button id="start">MASUK KE DUNIA NAURA 💗</button>
</div>
<button class="chip" id="skip">Lewati intro ⏭</button>
<div class="top-btns"><button class="chip" id="snd" aria-label="Musik">🔇 Musik</button></div>

<div id="flash"></div>
<div id="portal"><i></i><b></b></div>

<!-- GAME -->
<div class="hud" id="hud"><span class="lv" id="lv">LEVEL 1/5</span><div class="bar"><i id="pb"></i></div><span class="xp" id="xp">⭐ 0</span><button class="chip" id="sndG">🔇</button></div>
<div id="game"><div class="wrap" id="screen"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

/* ---------- musik (WebAudio, hanya setelah interaksi) ---------- */
var AC=null,musicOn=false,timer=null,step=0;

function loop(ts){
  if(!gl.run)return;raf=requestAnimationFrame(loop);
  var dt=Math.min(.05,(ts-last)/1000||.016);last=ts;gl.t+=dt;var t=gl.t;
  var heartY=0;
  if(gl.phase<2){heart.rotation.y+=dt*.55*gl.spin;heartY=Math.sin(t*1.2)*.12}
  else{var tg=Math.sin(t*.9)*.55;heart.rotation.y+=(tg-heart.rotation.y)*Math.min(1,dt*3);heart.rotation.z=Math.sin(t*.7)*.07;heartY=Math.sin(t*1.5)*.45}
  heart.position.y+=(heartY-heart.position.y)*Math.min(1,dt*4);
  var sc=heart.scale.x;sc+=(gl.scaleT*3.4-sc)*Math.min(1,dt*2.2);heart.scale.setScalar(sc);
  var cz=camera.position.z,tz=gl.camZ*(gl.phase===0?gl.base/9:1)*(gl.phase===1?1:1);
  if(gl.phase===0)tz=gl.base;else if(gl.phase===1)tz=gl.base*.78;
  camera.position.z=cz+(tz-cz)*Math.min(1,dt*(gl.phase===3?2.6:1.6));
  glow.material.opacity=.7+Math.sin(t*2)*.2;glow.scale.setScalar(sc*3.2);
  rings.children.forEach(function(m){m.rotation.z+=dt*m.userData.sp*gl.spin});
  rings.visible=gl.phase<2;rings.position.y=heart.position.y;
  orbiters.forEach(function(o,i){o.rotation.z+=dt*o.userData.sp*(gl.phase>=2?.6:1)});
  stars.material.opacity=.65+Math.sin(t*3)*.3;stars.rotation.z+=dt*.004;hstars.material.opacity=.6+Math.sin(t*2.2+1)*.35;
  mini.userData.pv.rotation.y+=dt*1.6;mini.userData.pv.rotation.z+=dt*.3;
  // komet
  if(comet.t<0){comet.next-=dt;if(comet.next<=0){comet.t=0}}
  else{comet.t+=dt/2.6;if(comet.t>1.15){comet.t=-1;comet.next=4+Math.random()*3}
    for(var i=0;i<cometTrail.length;i++){var u=Math.max(0,comet.t-i*.018);cometTrail[i].position.set(-16+u*32,7-u*11,-9);cometTrail[i].visible=comet.t<1.05}}
  if(comet.t<0)cometTrail.forEach(function(c){c.visible=false});
  renderer.render(scene,camera);
}

  return "💗 AGENT NAURA — MISSION REPORT 💗\n\nMisi: Ketemuan di dunia nyata\nStatus: DITERIMA ✅\n\n📅 Tanggal: "+fmtDate(f.d)+"\n🕒 Waktu: "+f.t+"\n📍 Lokasi: "+f.l+"\n🍜 Makanan: "+f.f+"\n🎈 Aktivitas: "+f.a+(f.m?"\n💌 Pesan: "+f.m:"")+"\n\n⭐ XP: "+S.xp+"\n🔬 Kecocokan (hiburan): "+S.score+"%\n\nDikirim dari NAURA'S LITTLE UNIVERSE";}
function report(){
  var f=S.form;$("#pb").style.width="100%";
  frame(5,'<span class="badge">🏆 MISI SELESAI</span><div class="report" id="rp"><h3>💗 AGENT NAURA<br>MISSION REPORT</h3><dl>'+
    "<dt>TANGGAL</dt><dd>"+esc(fmtDate(f.d))+"</dd><dt>WAKTU</dt><dd>"+esc(f.t)+"</dd><dt>LOKASI</dt><dd>"+esc(f.l)+"</dd><dt>MAKANAN</dt><dd>"+esc(f.f)+"</dd><dt>AKTIVITAS</dt><dd>"+esc(f.a)+"</dd>"+(f.m?"<dt>PESAN</dt><dd>"+esc(f.m)+"</dd>":"")+
    "<dt>XP / KECOCOKAN</dt><dd>⭐ "+S.xp+" / "+S.score+"% (hiburan)</dd></dl></div>"+
    '<p class="sub" style="margin-top:14px">Tekan tombol hijau untuk mengirim lembar ini ke WhatsApp GERDY. Kamu juga bisa menyimpannya sebagai gambar.</p>'+
    '<div class="row"><a class="btn wa" target="_blank" rel="noopener" href="'+wa(waText())+'">Kirim ke WhatsApp GERDY 💚</a><button class="btn alt" id="png">Unduh PNG 🖼</button><button class="btn ghost" id="again">Main lagi 🔁</button></div>');
  var r=$("#rp").getBoundingClientRect();burst(r.left+r.width/2,r.top+40,40);
  $("#png").onclick=png;$("#again").onclick=function(){S={xp:0,picks:0,flirt:0,score:0,form:{}};addXp(0);level(1)};
}
function png(){
  var f=S.form,c=document.createElement("canvas");c.width=800;c.height=1100;var x=c.getContext("2d");
  var g=x.createLinearGradient(0,0,800,1100);g.addColorStop(0,"#2a0a5e");g.addColorStop(1,"#c2186f");x.fillStyle=g;x.fillRect(0,0,800,1100);
  x.fillStyle="#fff";x.textAlign="center";x.font="bold 44px sans-serif";x.fillText("💗 AGENT NAURA 💗",400,110);x.font="bold 34px sans-serif";x.fillText("MISSION REPORT",400,160);
  x.textAlign="left";var y=250;
  function line(k,v){x.fillStyle="#ffb3dc";x.font="bold 24px sans-serif";x.fillText(k,70,y);y+=40;x.fillStyle="#fff";x.font="30px sans-serif";
    var w=String(v).split(" "),ln="";w.forEach(function(t){var tt=ln?ln+" "+t:t;if(x.measureText(tt).width>660){x.fillText(ln,70,y);y+=40;ln=t}else ln=tt});x.fillText(ln,70,y);y+=62}
  line("TANGGAL",fmtDate(f.d));line("WAKTU",f.t);line("LOKASI",f.l);line("MAKANAN",f.f);line("AKTIVITAS",f.a);if(f.m)line("PESAN",f.m);line("XP / KECOCOKAN",S.xp+" / "+S.score+"% (hiburan)");
  x.textAlign="center";x.fillStyle="#ffd6ec";x.font="22px sans-serif";x.fillText("Dibuat oleh GERDY — NAURA'S LITTLE UNIVERSE",400,1050);
  c.toBlob(function(b){var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="mission-report-naura.png";document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},2000);toast("Gambar tersimpan 💗")});
}

/* ---------- start ---------- */
initGL();startLoop();
if(reduce){gl.spin=.2;finalIntro()}else runIntro();
})();
</script>
